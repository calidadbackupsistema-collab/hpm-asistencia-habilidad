<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Examen · Básicos de la Calidad R02 · Hyundai Polytech México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#0B2D50;--navy-2:#0F2044;--blue:#0E75BC;--cyan:#42C6FF;--ink:#10263B;--ink-soft:#5A6C7E;--ink-faint:#8797A8;--line:#D7E1EB;--line-strong:#C3D2E0;--surface:#fff;--surface-alt:#F3F7FB;--accent-soft:#E6F2FA;--ok:#16834E;--ok-bg:#E8F6EF;--warn:#C87F0A;--warn-bg:#FCF3E3;--bad:#D7263D;--bad-bg:#FDECEE;--radius:14px;
--sans:'IBM Plex Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;--mono:'IBM Plex Mono','Malgun Gothic',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#fff;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(66,198,255,.6);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:18px}

/* Header estándar HPM */
.hpm-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#0B2D50,#0E75BC 65%,#128A9E);border-radius:20px;padding:16px 22px;color:#fff;box-shadow:0 14px 34px #0b2d5030;border-bottom:4px solid var(--bad)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:48px;background:#fff;border-radius:10px;padding:6px 10px;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;font:600 11.5px var(--mono);color:#fff}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 6px 18px #0b2d500d}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.sub{margin:0 0 18px;color:var(--ink-soft);font-size:13.5px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
.in{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #0e75bc22}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--blue);color:var(--navy)}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1em}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0b65a3}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--surface-alt)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.full{width:100%;margin-top:18px}

.rules{list-style:none;padding:0;margin:0}
.rules li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0}
.rules .k{font:700 20px var(--mono);color:var(--blue);min-width:56px}
.rules .v{font-size:13.5px;color:var(--ink-soft)}
.rules .v b{color:var(--ink);display:block;font-size:14px}
.topics{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--navy)}
.pill.nc{background:var(--bad-bg);color:#9B1729}

/* Examen */
.examtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.who{font-weight:600;color:var(--navy)}
.who small{display:block;font-weight:500;color:var(--ink-soft);font-size:12.5px}
.counter{font:600 14px var(--mono);color:var(--ink-soft)}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-bottom:16px}
.dot{height:30px;border-radius:7px;border:1px solid var(--line-strong);background:#fff;font:600 11px var(--mono);color:var(--ink-faint);cursor:pointer;padding:0}
.dot.ans{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.cur{outline:3px solid var(--cyan);outline-offset:1px}
@media (max-width:600px){.dots{grid-template-columns:repeat(10,1fr)}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ref{font:600 12px var(--mono);color:var(--ink-faint)}
.qtext{font-size:21px;line-height:1.4;font-weight:600;margin:0 0 20px;color:var(--ink);max-width:70ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue)}
.opt .lt{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:700 13px var(--mono);color:var(--ink-soft)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--accent-soft)}
.opt[aria-checked="true"] .lt{background:var(--blue);border-color:var(--blue);color:#fff}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* Resultados */
.sync-line{font-size:12.5px;margin-top:10px;color:var(--ink-soft)}
.sync-line.ok{color:#1E8E5A}.sync-line.warn{color:#B7791F}
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--navy-2);color:#fff;border-radius:18px;padding:24px 26px;margin-top:18px}
@media (max-width:640px){.res-hero{grid-template-columns:1fr}}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font:700 34px var(--mono);display:block;line-height:1}
.ring .num span{font-size:12px;opacity:.8}
.verdict{display:inline-block;border-radius:20px;padding:5px 14px;font-weight:700;font-size:14px;margin-bottom:10px}
.verdict.ok{background:var(--ok);color:#fff}
.verdict.bad{background:var(--bad);color:#fff}
.res-hero h2{color:#fff;font-size:22px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin-top:12px;font-size:13px}
.kv div span{display:block;opacity:.7;font-size:11.5px}
.kv div b{font-weight:600}
.cats{display:grid;gap:12px;margin-top:6px}
.cat{display:grid;grid-template-columns:minmax(150px,220px) 1fr 54px;gap:12px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--surface-alt);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.low{background:var(--bad)}
.cat .pc{font:600 13px var(--mono);text-align:right}
.rev-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rev{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;break-inside:avoid}
.rev.okq{border-left-width:1px}
.rev .rq{font-weight:600;margin:6px 0 8px}
.ans-line{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:4px}
.ans-line.ok{background:var(--ok-bg);color:#0F5E38}
.ans-line.bad{background:var(--bad-bg);color:#9B1729}
.exp{font-size:13.5px;color:var(--ink-soft);margin-top:8px}
.mark{font:700 12px var(--mono);border-radius:6px;padding:2px 8px}
.mark.ok{background:var(--ok-bg);color:var(--ok)}
.mark.bad{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.sign{display:none}
.certificate-heading,.certificate-sign{display:none}
.pdf-help{margin:10px 0;color:var(--ink-soft);font-size:13px}
@media print{
  body.certificate-print #screen-result > .card{display:none!important}
  body.certificate-print .certificate-heading{display:block;text-align:center;margin:32px 0 22px}
  body.certificate-print .certificate-heading h2{font-size:28px}
  body.certificate-print .certificate-heading p{font-size:16px}
  body.certificate-print .res-hero{background:#fff;color:var(--ink);border:2px solid var(--navy);margin-top:24px;grid-template-columns:auto 1fr;break-inside:avoid}
  body.certificate-print .res-hero h2{color:var(--navy)}
  body.certificate-print .kv div span,body.certificate-print .ring .num span{opacity:1}
  body.certificate-print .certificate-sign{display:grid;margin-top:80px}
}

/* Historial */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:680px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:12.5px}
td{padding:9px 12px;border-top:1px solid var(--line)}
tr:nth-child(even) td{background:var(--surface-alt)}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}

/* Diálogo */
.modal{position:fixed;inset:0;background:#0b2d5066;display:grid;place-items:center;padding:20px;z-index:50}
.modal .card{max-width:440px;width:100%}
.modal p{color:var(--ink-soft);margin:6px 0 0}

.foot{margin:26px 0 8px;text-align:center;color:var(--ink-faint);font-size:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:letter;margin:12mm}
  body{font-size:11.5px}
  .wrap{max-width:none;padding:0}
  .hdr-actions,.actions,.rev-head .seg,#screen-history,.foot,.no-print{display:none!important}
  .hpm-header{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:10px 16px}
  .res-hero,.verdict,.bar i,th,.ans-line,.mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .res-hero{padding:14px 18px}
  .ring{width:120px;height:120px}
  .ring .num b{font-size:24px}
  .card{box-shadow:none;padding:14px}
  .rev{padding:8px 12px;margin-bottom:6px}
  .rev[data-hide]{display:block!important}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px;break-inside:avoid}
  .sign div{border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:11px}
}
</style>

const QEN=[{"q": "HPM's quality mindset is based on three commitments. What are they?", "o": ["I receive, I produce, I deliver (with quality)", "I inspect, I report, I rest", "I buy, I sell, I collect", "I produce, the inspector checks, the customer decides"], "e": "Everyone is responsible for the quality of what they receive, what they produce and what they deliver to the next process."}, {"q": "In 5S, what does “Set in order” (Ordenar) mean?", "o": ["A place for everything: organize what is needed in a logical, accessible way", "Remove from the area everything that is not needed", "Eliminate dust, dirt and sources of contamination", "Evaluate, correct and improve continuously"], "e": "Sort = remove what is not needed; Set in order = a place for everything; Shine = remove dirt; Standardize = rules; Sustain = habit."}, {"q": "What is an NCR?", "o": ["A nonconformity reported by customers, or a claim from HPM to its suppliers", "A new reference code for the part number", "An internal plant problem that stays in the area", "The part specification established in the drawing"], "e": "An internal plant problem is an ISSUE; the drawing specification is the SPEC."}, {"q": "A critical characteristic (CC) is related to…", "o": ["The safety, function or assembly of the part", "Only color and appearance", "Cost and selling price", "The number of parts per box"], "e": "CC = critical characteristic. An error in it can affect safety, function or assembly at the customer."}, {"q": "A Go / No Go gage only shows whether the part passes or fails. What type is it?", "o": ["Attribute: the characteristic is conforming or nonconforming", "Variable: it gives an actual measurement in units", "A height measuring instrument", "A Poka-Yoke device"], "e": "Variables = actual measurement expressed in a unit (caliper, height gage). Attributes = conforming / nonconforming."}, {"q": "According to the Escalation Plan, when 5 nonconformities accumulate in inspection, who is it escalated to?", "o": ["The Production / Quality supervisor", "Only the operators in the area", "The plant manager", "It is not escalated until it reaches 10"], "e": "3 NC → operators/inspectors; 5 NC → supervisor; 7 NC → operations/quality manager; 10 NC → plant manager. An accident is escalated immediately."}, {"q": "What is the RED tag used for?", "o": ["To identify SCRAP (nonconforming material)", "To identify suspect product", "To release previously rejected product", "To identify material in transit to the customer"], "e": "Red = scrap / nonconforming; Yellow = suspect; Green = released."}, {"q": "You find parts whose condition is not yet confirmed. Which tag do you put on them?", "o": ["Yellow: suspect material", "Red: scrap", "Green: OK material", "None, they stay on the line"], "e": "Suspect product is identified with a yellow tag and held until it is validated."}, {"q": "What does the GREEN “Material OK” tag indicate?", "o": ["The release of product that was previously rejected", "That the material goes straight to scrap", "That the material is waiting for evaluation", "That the part is a Red Rabbit"], "e": "The green tag records that held material has been evaluated and released."}, {"q": "On the Suspect Product Tag (Etiqueta de Producto Sospechoso), who is recorded as responsible?", "o": ["One person from Process and one from Quality, with full name", "Only the customer", "The plant manager, with signature only", "No one is recorded as responsible"], "e": "The tag asks for model, product name, reason, quantity of parts, Process and Quality responsibles, and the date the material was identified."}, {"q": "If material is in the Quarantine Area, it means that…", "o": ["It is held until there is an authorized decision", "It is automatically scrap", "It is already released for shipping", "It can be used if the line is in a hurry"], "e": "Quarantine does not mean scrap: the material is waiting for evaluation and an authorized decision."}, {"q": "How must the Quarantine Area be kept?", "o": ["Always locked, with material correctly identified", "Open so anyone can take material when needed", "Locked, even if the material has no tag", "Next to good product to save space"], "e": "Its purpose is to prevent suspect or nonconforming material from mixing with good product or moving forward by mistake."}, {"q": "What happens if we ship nonconforming parts to the customer?", "o": ["Customer complaint and penalty, quality alert, containment at HPM and at the customer, and line-stop costs", "Nothing, the customer sorts them at no cost", "The parts are just replaced in the next shipment", "The customer pays us a bonus for finding them"], "e": "The cost of an escape includes penalties, containment at two plants and the customer's line stop."}, {"q": "When is a process deviation EXTERNAL?", "o": ["When it involves a critical characteristic (safety, function or assembly) and requires customer approval", "When it is controlled internally without notifying the customer", "When the product does meet the specification", "When the operator decides it during the shift"], "e": "Internal: controlled within HPM without notifying the customer (but departments must be informed). External: requires customer approval."}, {"q": "What is a Poka-Yoke for?", "o": ["To prevent errors by making human mistakes impossible or very difficult", "To measure dimensions precisely", "To print the date on parts", "To speed up the injection machine"], "e": "A Poka-Yoke ensures final quality by preventing the error from happening or moving forward."}, {"q": "What is the Red Rabbit part?", "o": ["An intentionally nonconforming sample used to verify that the Poka-Yoke detects the error", "An OK master part used to verify that good parts are not rejected", "A scrap part that can be reused", "The first piece of the shift released by Quality"], "e": "Red Rabbit = NONconforming sample (the PKYK must reject it). Green Rabbit = OK master (the PKYK must accept it)."}, {"q": "What are date stampers (fechadores) for?", "o": ["To print the date and other information to control part traceability", "To paint parts with missing paint", "To trim flash from the part", "To count the parts per box"], "e": "Traceability tells us when a part was made and lets us define the scope of a containment."}, {"q": "In which of these situations is GP12 containment required?", "o": ["At the launch of a new product", "When the area is clean and organized", "When the shift changes without problems", "When the box inventory runs out"], "e": "GP12 applies at new product launch, special containment due to a complaint, high nonconforming or suspect product, or validating a supplier with poor quality."}, {"q": "Which of these is a common defect in the Injection area?", "o": ["Splay, porosity, haze or warpage", "Wrong component sequence", "Poor blowing", "Missing work on rubber"], "e": "Wrong sequence = Assembly; poor blowing = Autoblow; missing work = Rubber."}, {"q": "A coworker is doing unsafe work. What should you do?", "o": ["Stop the operation, warn them and report to Safety, the leader or the supervisor", "Keep working; it's not my responsibility", "Wait until the end of the shift to mention it", "Take a photo and post it on social media"], "e": "Stopping and warning prevents the accident; Safety or the supervisor corrects the condition and keeps it under control."}];
Q.forEach((x,i)=>{const t=QEN[i];x.q.en=t.q;x.e.en=t.e;x.o.forEach((o,j)=>o.en=t.o[j])});

  document.querySelectorAll("[data-i]").forEach(el=>{const v=t(el.dataset.i);if(typeof v==="string")el.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const a=$("fArea"),sel=a.value;
  a.innerHTML=`<option value="">${t("selArea")}</option>`+AREAS.map(x=>`<option value="${x[0]}">${x[LI[lang]]}</option>`).join("");
  a.value=sel;
  const cnt={};Q.forEach(q=>cnt[q.c]=(cnt[q.c]||0)+1);
  $("topicPills").innerHTML=Object.keys(CATS).map(k=>`<span class="pill${k==="pnc"?" nc":""}">${L(CATS[k])} · ${cnt[k]}</span>`).join("");
  const c=current();
  if(c==="screen-exam")renderQ();
  if(c==="screen-result")renderResult();
  if(c==="screen-history")renderHistory();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});

/* ---------- Registro ---------- */
document.querySelectorAll("#fShift button").forEach(b=>b.onclick=()=>{shift=b.dataset.v;document.querySelectorAll("#fShift button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("btnStart").onclick=()=>{
  const name=$("fName").value.trim(),emp=$("fEmp").value.trim(),area=$("fArea").value;
  const e=!name?"errName":!emp?"errEmp":!area?"errArea":!shift?"errShift":"";
  $("regErr").textContent=e?t(e):"";
  if(e)return;
  S={name,emp,area,shift,inst:$("fInst").value.trim(),start:Date.now(),i:0,
     items:shuffle(Q.map((q,qi)=>qi)).map(qi=>({qi,order:shuffle([0,1,2,3]),ans:null}))};
  show("screen-exam");renderQ();
};

/* ---------- Examen ---------- */
function renderQ(){
  const it=S.items[S.i],q=Q[it.qi];
  $("whoLine").innerHTML=`${esc(S.name)}<small>${esc(S.emp)} · ${esc(areaLabel(S.area))} · ${t("fShift")} ${esc(S.shift)}</small>`;
  $("counter").textContent=`${t("q")} ${S.i+1} ${t("of")} 20`;
  $("dots").innerHTML=S.items.map((x,k)=>`<button class="dot${x.ans!==null?" ans":""}${k===S.i?" cur":""}" data-k="${k}" aria-label="${t("q")} ${k+1}">${k+1}</button>`).join("");
  $("dots").querySelectorAll(".dot").forEach(d=>d.onclick=()=>{S.i=+d.dataset.k;renderQ()});
  $("qmeta").innerHTML=`<span class="pill${q.c==="pnc"?" nc":""}">${L(CATS[q.c])}</span><span class="ref">${t("slide")} ${q.s}</span>`;
  $("qtext").textContent=L(q.q);
  $("opts").innerHTML=it.order.map((oi,k)=>`<button class="opt" role="radio" aria-checked="${it.ans===oi}" data-oi="${oi}"><span class="lt">${"ABCD"[k]}</span><span>${esc(L(q.o[oi]))}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{it.ans=+b.dataset.oi;renderQ()});
  $("btnPrev").disabled=S.i===0;
  const last=S.i===19;
  $("btnNext").textContent=last?t("finish"):t("next");
}
function areaLabel(v){const a=AREAS.find(x=>x[0]===v);return a?a[LI[lang]]:v}
$("btnPrev").onclick=()=>{if(S.i>0){S.i--;renderQ()}};
$("btnNext").onclick=()=>{
  if(S.i<19){S.i++;renderQ();return}
  const un=S.items.filter(x=>x.ans===null).length;
  if(un)openModal(t("mUnTitle"),t("mUnText")(un),t("mUnOk"),t("mUnCancel"),finish);
  else openModal(t("mFinTitle"),t("mFinText"),t("mFinOk"),t("mFinCancel"),finish);
};
document.addEventListener("keydown",e=>{
  if($("screen-exam").hidden||!$("modal").hidden||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1){const it=S.items[S.i];it.ans=it.order["ABCD".indexOf(k)];renderQ()}
  else if(e.key==="ArrowRight"&&S.i<19){S.i++;renderQ()}
  else if(e.key==="ArrowLeft"&&S.i>0){S.i--;renderQ()}
});

function finish(){
  S.end=Date.now();
  S.score=S.items.filter(x=>x.ans===0).length;
  S.passed=S.score>=16;
  S.done=true;
  saveHistory();
  revMode="all";
  show("screen-result");renderResult();
}

/* ---------- Resultados ---------- */
function fmtDate(ms){const d=new Date(ms);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function renderResult(){
  const pct=Math.round(S.score/20*100);
  $("rScore").textContent=`${S.score}/20`;
  $("rPct").textContent=`${pct}% ${t("correct")}`;
  const arc=$("ringArc");arc.setAttribute("stroke",S.passed?"#42C6FF":"#FF6B7D");
  requestAnimationFrame(()=>{arc.style.transition="stroke-dashoffset .9s ease";arc.setAttribute("stroke-dashoffset",(326.7*(1-pct/100)).toFixed(1))});
  const v=$("rVerdict");v.textContent=S.passed?t("pass"):t("fail");v.className="verdict "+(S.passed?"ok":"bad");
  $("rName").textContent=S.name;
  setSync(syncState);
  const mins=Math.max(1,Math.round((S.end-S.start)/60000));
  $("rKv").innerHTML=[["kEmp",S.emp],["kArea",areaLabel(S.area)],["kShift",S.shift],["kInst",S.inst||"—"],["kDate",fmtDate(S.end)],["kTime",`${mins} ${t("min")}`]]
    .map(([k,v])=>`<div><span>${t(k)}</span><b>${esc(v)}</b></div>`).join("");
  $("cats").innerHTML=Object.keys(CATS).map(k=>{
    const its=S.items.filter(x=>Q[x.qi].c===k),ok=its.filter(x=>x.ans===0).length,p=Math.round(ok/its.length*100);
    return `<div class="cat"><span>${L(CATS[k])}</span><div class="bar"><i class="${p<80?"low":""}" style="width:${p}%"></i></div><span class="pc">${ok}/${its.length}</span></div>`}).join("");
  document.querySelectorAll("#revFilter button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===revMode));
  $("revList").innerHTML=S.items.map((x,k)=>{
    const q=Q[x.qi],ok=x.ans===0;
    const hide=revMode==="bad"&&ok?" data-hide hidden":"";
    const yours=x.ans===null?t("noAns"):L(q.o[x.ans]);
    return `<div class="rev"${hide}>
      <div class="qmeta" style="margin:0"><span class="mark ${ok?"ok":"bad"}">${k+1} · ${ok?t("ok"):t("bad")}</span><span class="ref">${L(CATS[q.c])} · ${t("slide")} ${q.s}</span></div>
      <div class="rq">${esc(L(q.q))}</div>
      ${ok?`<div class="ans-line ok">${t("yourAns")}: ${esc(yours)}</div>`
          :`<div class="ans-line bad">${t("yourAns")}: ${esc(yours)}</div><div class="ans-line ok">${t("rightAns")}: ${esc(L(q.o[0]))}</div>`}
      <div class="exp">${esc(L(q.e))}</div></div>`}).join("");
}
document.querySelectorAll("#revFilter button").forEach(b=>b.onclick=()=>{revMode=b.dataset.v;renderResult()});
let printTitle=null;
function restorePrint(){document.body.classList.remove("certificate-print");if(printTitle!==null){document.title=printTitle;printTitle=null}}
window.addEventListener("afterprint",restorePrint);
$("btnCertificate").onclick=()=>{
  if(!S||!S.done)return;
  restorePrint();
  printTitle=document.title;
  document.title=`Certificado_Basicos_Calidad_${S.emp.replace(/[^a-zA-Z0-9_-]/g,"_")}_${fmtDate(S.end).slice(0,10)}`;
  document.body.classList.add("certificate-print");
  try{window.print()}catch(e){restorePrint();throw e}
};
$("btnPrint").onclick=()=>{restorePrint();window.print()};
$("btnNew").onclick=()=>resetToStart();
function resetToStart(){syncState="";S=null;shift="";["fName","fEmp","fInst"].forEach(i=>$(i).value="");$("fArea").value="";
  document.querySelectorAll("#fShift button").forEach(x=>x.setAttribute("aria-pressed","false"));$("regErr").textContent="";show("screen-start")}

/* ---------- Envío al sistema de Calidad (index.html) ----------
   Cada examen terminado se agrega a la bandeja kv/exam:basicos-inbox.
   index.html la lee, empata por No. de empleado y lo registra en el
   expediente (curso "Básicos de Calidad HPM"). Si no hay red, el
   resultado espera en este equipo y se reintenta solo. */
const PENDING_KEY="hpm_exam_basicos_pending";
let syncState="";
function loadPending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||"[]")}catch(e){return []}}
function savePending(a){try{localStorage.setItem(PENDING_KEY,JSON.stringify(a))}catch(e){}}
function setSync(st){syncState=st;const el=$("rSync");if(!el)return;
  el.className="sync-line "+(st==="ok"?"ok":st==="fail"?"warn":"");
  el.textContent=st?t(st==="ok"?"syncOk":st==="fail"?"syncFail":"syncWait"):""}
async function flushPending(){
  const items=loadPending();if(!items.length)return true;
  const fb=window.__fbExam;if(!fb){setSync("fail");return false}
  try{
    await fb.setDoc(fb.doc(fb.db,"kv","exam:basicos-inbox"),{items:fb.arrayUnion(...items),updatedAt:Date.now()},{merge:true});
    const sent=new Set(items.map(x=>x.id));
    savePending(loadPending().filter(x=>!sent.has(x.id)));
    return true;
  }catch(e){console.error("Envío de resultado falló",e);return false}
}
async function queueResult(r){
  const p=loadPending();p.push(r);savePending(p);
  setSync("wait");
  setSync(await flushPending()?"ok":"fail");
}
window.addEventListener("fbexam-ready",()=>flushPending());
window.addEventListener("online",()=>flushPending().then(ok=>{if(ok&&syncState==="fail")setSync("ok")}));

/* ---------- Historial local ---------- */
function loadHistory(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){return []}}
function saveHistory(){
  try{const h=loadHistory();
    h.unshift({date:fmtDate(S.end),name:S.name,emp:S.emp,area:S.area,shift:S.shift,inst:S.inst,score:S.score,pct:Math.round(S.score/20*100),passed:S.passed,
      mins:Math.max(1,Math.round((S.end-S.start)/60000)),wrong:S.items.filter(x=>x.ans!==0).map(x=>Q[x.qi].s).join(" ")});
    localStorage.setItem(LS_KEY,JSON.stringify(h.slice(0,2000)))}catch(e){}
  const d=new Date(S.end),p=n=>String(n).padStart(2,"0");
  queueResult({id:`${S.end}-${String(S.emp).replace(/[^a-zA-Z0-9]/g,"")}`,examen:"basicos",
    fecha:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,hora:`${p(d.getHours())}:${p(d.getMinutes())}`,
    name:S.name,emp:S.emp,area:S.area,shift:S.shift,inst:S.inst||"",score:S.score,total:20,
    pct:Math.round(S.score/20*100),passed:S.passed,mins:Math.max(1,Math.round((S.end-S.start)/60000)),
    wrong:S.items.filter(x=>x.ans!==0).map(x=>Q[x.qi].s).join(" ")});
}
function renderHistory(){
  const h=loadHistory();
  if(!h.length){$("histTbl").innerHTML=`<div class="empty">${t("histEmpty")}</div>`;return}
  $("histTbl").innerHTML=`<table><thead><tr><th>${t("hDate")}</th><th>${t("hName")}</th><th>${t("hEmp")}</th><th>${t("hArea")}</th><th>${t("hShift")}</th><th>${t("hScore")}</th><th>${t("hRes")}</th></tr></thead><tbody>`+
    h.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.emp)}</td><td>${esc(areaLabel(r.area))}</td><td>${esc(r.shift)}</td><td style="font-family:var(--mono)">${r.score}/20 (${r.pct}%)</td><td><span class="mark ${r.passed?"ok":"bad"}">${r.passed?t("pass"):t("fail")}</span></td></tr>`).join("")+`</tbody></table>`;
}
$("btnHistory").onclick=()=>{
  if(current()==="screen-exam"&&S&&!S.done){openModal(t("mNewTitle"),t("mNewText"),t("mNewOk"),t("mNewCancel"),()=>{S=null;show("screen-history");renderHistory()});return}
  show("screen-history");renderHistory()};
$("btnBack").onclick=()=>{if(S&&S.done){show("screen-result");renderResult()}else resetToStart()};
$("btnClear").onclick=()=>openModal(t("mClrTitle"),t("mClrText"),t("mClrOk"),t("mClrCancel"),()=>{try{localStorage.removeItem(LS_KEY)}catch(e){}renderHistory()});
$("btnCsv").onclick=()=>{
  const h=loadHistory();if(!h.length)return;
  const head=["Fecha","Nombre","No. empleado","Área","Turno","Instructor","Aciertos","Porcentaje","Resultado","Duración (min)","Láminas a reforzar"];
  const rows=h.map(r=>[r.date,r.name,r.emp,r.area,r.shift,r.inst,r.score,r.pct,r.passed?"APROBADO":"NO APROBADO",r.mins,r.wrong]);
  const csv="\ufeff"+[head,...rows].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`Examen_Basicos_Calidad_R02_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();
};

/* ---------- Diálogo ---------- */
function openModal(title,text,okTxt,cancelTxt,cb){$("mTitle").textContent=title;$("mText").textContent=text;$("mOk").textContent=okTxt;$("mCancel").textContent=cancelTxt;modalCb=cb;$("modal").hidden=false;$("mCancel").focus()}
$("mCancel").onclick=()=>{$("modal").hidden=true};
$("mOk").onclick=()=>{$("modal").hidden=true;if(modalCb)modalCb()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden)$("modal").hidden=true});
window.addEventListener("beforeunload",e=>{if(S&&!S.done){e.preventDefault();e.returnValue=""}});

applyLang();
</script>
</body>
</html>
